[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "toolgraph"
version = "0.1.0"
description = "Durable, side-effect-aware DAG execution for MCP tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ashwin Srirankan" }]
keywords = ["mcp", "agents", "durable-execution", "idempotency", "dag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["mcp>=2.3", "pytest>=8", "hypothesis>=6.100"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not realworld'"
markers = [
    "realworld: separate processes, real transports and SIGKILLs, reference MCP servers (pytest -m realworld)",
]

[tool.ruff]
line-length = 120
